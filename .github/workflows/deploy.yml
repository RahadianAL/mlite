name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "$SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/hostinger_deploy_key"
          chmod 600 "$HOME/.ssh/hostinger_deploy_key"

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/hostinger_deploy_key" \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "$USERNAME@$HOST" <<'REMOTE'
          set -e

          cd /home/u213564467/domains/gksehatklinik.com/public_html

          echo "==> Fetch repository"
          git fetch origin master

          echo "==> Reset production ke origin/master"
          git reset --hard origin/master

          echo "==> Install Composer dependencies"
          composer install --no-dev --optimize-autoloader

          echo "==> Deployment selesai"
          REMOTE
